<head>
<meta charset="utf-8">

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-q1IJSrzDKAvSXt/x5smsDVvRmTKP52MvpQQeh2WTV/U='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Page not found</title>
<style>
  body { font: 1rem/1.5 system-ui, sans-serif; margin: 3rem auto; max-width: 32rem; padding: 0 1rem; color: #ddd; background: #121212; }
  a { color: #8ab4f8; }
</style>
<script>
// GitHub Pages paths are case-sensitive: /dictionarius/ finds nothing, and GitHub serves this
// page. Send any spelling of the app's folder to /Dictionarius/, keeping the rest of the
// address (path, search, #part). Returns the fixed path, or null when there's nothing to fix.
function fixedPath(path) {
  var match = /^\/(dictionarius)(\/.*)?$/i.exec(path);
  if (!match || match[1] === "Dictionarius") return null;
  return "/Dictionarius" + (match[2] || "/");
}
// run:
var to = fixedPath(location.pathname);
if (to) location.replace(to + location.search + location.hash);
</script>
</head>
<body>
<h1>Page not found</h1>
<p>Looking for the dictionary? It's at <a href="/Dictionarius/">smitravitz.github.io/Dictionarius</a>.</p>
</body>
